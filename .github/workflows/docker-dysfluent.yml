name: Build and Push DysfluentWFST

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/speech_processing/DysfluentWFST/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/speech_processing/DysfluentWFST
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dysfluent-wfst:latest
