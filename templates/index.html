<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santé — Voice AI Health Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <div class="app">

    <!-- Subtle top branding -->
    <header class="topbar">
      <div class="topbar-brand">
        <svg class="topbar-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
                   2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 
                   3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 
                   3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span>Santé</span>
      </div>
      <div class="topbar-badge">AI Health Assistant</div>
    </header>

    <!-- Center hero: the button -->
    <main class="hero">
      <div class="btn-container" id="btn-container">
        <!-- Animated rings -->
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>

        <button class="sante-btn" id="sante-btn">
          <span class="btn-label">Santé</span>
        </button>
      </div>

      <p class="status" id="status">Tap to begin your health consultation</p>
    </main>

    <!-- Transcript area -->
    <footer class="transcript-area" id="transcript-area">
      <div class="transcript-scroll" id="transcript-scroll"></div>
    </footer>

  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
